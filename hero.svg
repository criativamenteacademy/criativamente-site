<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F0A05"/>
      <stop offset="100%" stop-color="#2A1D12"/>
    </linearGradient>
    <linearGradient id="copper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8892A"/>
      <stop offset="100%" stop-color="#B5541A"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- decorative dot grid -->
  <g opacity="0.15">
    <circle cx="80" cy="80" r="3" fill="#E8892A"/>
    <circle cx="130" cy="80" r="3" fill="#E8892A"/>
    <circle cx="80" cy="130" r="3" fill="#E8892A"/>
    <circle cx="1100" cy="550" r="3" fill="#E8892A"/>
    <circle cx="1150" cy="550" r="3" fill="#E8892A"/>
    <circle cx="1100" cy="500" r="3" fill="#E8892A"/>
  </g>

  <!-- chat bubble left -->
  <g transform="translate(140,190)">
    <rect x="0" y="0" width="300" height="150" rx="24" fill="#FDF6E3"/>
    <path d="M40 150 L40 190 L90 150 Z" fill="#FDF6E3"/>
    <rect x="30" y="35" width="200" height="14" rx="7" fill="#6B5744" opacity="0.5"/>
    <rect x="30" y="65" width="240" height="14" rx="7" fill="#6B5744" opacity="0.5"/>
    <rect x="30" y="95" width="150" height="14" rx="7" fill="#6B5744" opacity="0.5"/>
  </g>

  <!-- chat bubble right - the one that now costs -->
  <g transform="translate(560,340)">
    <rect x="0" y="0" width="300" height="150" rx="24" fill="url(#copper)"/>
    <path d="M260 150 L260 190 L210 150 Z" fill="#B5541A"/>
    <rect x="30" y="35" width="200" height="14" rx="7" fill="#FDF6E3" opacity="0.85"/>
    <rect x="30" y="65" width="240" height="14" rx="7" fill="#FDF6E3" opacity="0.85"/>
    <rect x="30" y="95" width="150" height="14" rx="7" fill="#FDF6E3" opacity="0.85"/>

    <!-- coin badge -->
    <circle cx="280" cy="-10" r="34" fill="#FDF6E3" stroke="#0F0A05" stroke-width="3"/>
    <text x="280" y="1" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#B5541A" text-anchor="middle">R$</text>
  </g>

  <!-- clock icon (24h window) -->
  <g transform="translate(870,150)">
    <circle cx="0" cy="0" r="55" fill="none" stroke="#E8892A" stroke-width="4" opacity="0.9"/>
    <line x1="0" y1="0" x2="0" y2="-32" stroke="#E8892A" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="0" x2="22" y2="10" stroke="#E8892A" stroke-width="4" stroke-linecap="round"/>
    <text x="0" y="85" font-family="Arial, sans-serif" font-size="18" fill="#C9AE8F" text-anchor="middle">janela de 24h</text>
  </g>

  <!-- headline -->
  <text x="100" y="580" font-family="Arial, sans-serif" font-size="40" font-weight="700" fill="#FDF6E3">WhatsApp: o fim das respostas grátis</text>
</svg>
