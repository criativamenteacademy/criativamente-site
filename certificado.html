<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Certificado — CriativaMente Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <style>
    /* Identidade Estratégia e Essência — certificado */
    .certificado-tela { min-height:100vh; background:#1F2937; display:flex; flex-direction:column; align-items:center; padding:40px 20px 80px; }
    .certificado-acoes { width:100%; max-width:900px; display:flex; justify-content:space-between; align-items:center; margin-bottom:24px; font-family:"Inter",sans-serif; }
    .certificado-voltar { color:#1F2937; text-decoration:none; font-size:14px; font-weight:600; }
    .certificado-imprimir { background:#D97706; color:#fff; border:0; border-radius:8px; padding:11px 22px; font-size:14px; font-weight:600; cursor:pointer; font-family:"Inter",sans-serif; }
    .certificado-imprimir:hover { background:#B45309; }
    .certificado-folha {
      position:relative; box-sizing:border-box; isolation:isolate; width:100%; max-width:900px;
      background:#fff; border:2px solid #1F2937; padding:75px 74px 65px;
      text-align:center; font-family:"Inter",sans-serif; color:#1F2937;
      box-shadow:0 12px 32px rgba(31,41,55,.08);
    }
    /* Moldura grega geométrica própria, discreta, distinta de qualquer marca. */
    .certificado-folha::before {
      content:""; position:absolute; inset:12px; pointer-events:none; z-index:-1;
      border:1px solid #D97706;
      background:
        repeating-linear-gradient(90deg,#D97706 0 2px,transparent 2px 12px,#D97706 12px 14px,transparent 14px 25px) top 9px left 14px / calc(100% - 28px) 2px no-repeat,
        repeating-linear-gradient(90deg,#D97706 0 2px,transparent 2px 12px,#D97706 12px 14px,transparent 14px 25px) bottom 9px left 14px / calc(100% - 28px) 2px no-repeat,
        repeating-linear-gradient(0deg,#D97706 0 2px,transparent 2px 12px,#D97706 12px 14px,transparent 14px 25px) left 9px top 14px / 2px calc(100% - 28px) no-repeat,
        repeating-linear-gradient(0deg,#D97706 0 2px,transparent 2px 12px,#D97706 12px 14px,transparent 14px 25px) right 9px top 14px / 2px calc(100% - 28px) no-repeat;
      opacity:.72;
    }
    .certificado-marca { font-family:"Cormorant Garamond",Georgia,serif; font-size:25px; font-weight:700; letter-spacing:.6px; color:#D97706; margin:0 0 30px; }
    .certificado-marca span { color:#1F2937; }
    .certificado-titulo { font-family:"Cormorant Garamond",Georgia,serif; font-size:29px; font-weight:600; letter-spacing:2px; text-transform:uppercase; color:#0E7490; margin:0 0 12px; }
    .certificado-texto { font-size:16px; line-height:1.7; max-width:680px; margin:0 auto; }
    .certificado-aluno { font-family:"Cormorant Garamond",Georgia,serif; font-size:40px; font-weight:700; color:#1F2937; margin:16px 0; }
    .certificado-curso { display:block; font-family:"Cormorant Garamond",Georgia,serif; font-size:43px; line-height:1.1; font-weight:700; color:#D97706; margin:12px auto 0; overflow-wrap:anywhere; }
    .certificado-data { margin-top:22px; font-size:14px; color:#526071; }
    .certificado-assinatura { margin-top:35px; display:flex; flex-direction:column; align-items:center; }
    .certificado-assinatura img { height:100px; object-fit:contain; margin-bottom:2px; }
    .certificado-assinatura-linha { width:220px; border-top:1px solid #1F2937; padding-top:8px; font-size:13px; }
    .certificado-assinatura-nome { font-weight:600; }
    .certificado-assinatura-cargo { color:#526071; font-size:12px; }
    .certificado-aviso { max-width:480px; margin:100px auto; text-align:center; font-family:"Inter",sans-serif; color:#1F2937; padding:0 24px; }
    .certificado-aviso h1 { font-family:"Cormorant Garamond",Georgia,serif; font-size:30px; margin-bottom:10px; }
    .certificado-aviso p { color:#526071; margin-bottom:24px; }
    @media(max-width:650px) {
      .certificado-folha { padding:60px 35px 45px; }
      .certificado-curso { font-size:32px; }
      .certificado-aluno { font-size:34px; }
      .certificado-acoes { gap:12px; flex-wrap:wrap; }
    }
    @media print {
      .certificado-acoes { display:none!important; }
      .certificado-tela { padding:0; background:#fff; min-height:0; }
      .certificado-folha { width:100%; max-width:none; min-height:100vh; box-shadow:none; border:2px solid #1F2937; padding:55px 70px 40px; }
      .certificado-folha::before { print-color-adjust:exact; -webkit-print-color-adjust:exact; }
      @page { size:landscape; margin:0; }
    }
  </style>
</head>
<body class="auth-checking">

  <div class="auth-loading">Carregando certificado...</div>

  <div class="certificado-tela" id="tela-certificado" style="display:none;">
    <div class="certificado-acoes">
      <a class="certificado-voltar" id="link-voltar" href="/area-do-aluno.html">← Voltar para minha área</a>
      <button class="certificado-imprimir" id="botao-imprimir">Baixar / imprimir certificado</button>
    </div>

    <div class="certificado-folha">
      <p class="certificado-marca">Criativa<span>Mente</span> Academy</p>
      <p class="certificado-titulo">Certificado de conclusão</p>
      <p class="certificado-texto">Certificamos que</p>
      <p class="certificado-aluno" id="certificado-nome-aluno"></p>
      <p class="certificado-texto">
        concluiu com dedicação o curso
        <span class="certificado-curso" id="certificado-nome-curso"></span>
      </p>
      <p class="certificado-data" id="certificado-data"></p>

      <div class="certificado-assinatura">
        <img src="/assinatura-jhoni.png" alt="Assinatura de Jhoni Guilherme da Silva" />
        <div class="certificado-assinatura-linha">
          <p class="certificado-assinatura-nome">Jhoni Silva</p>
          <p class="certificado-assinatura-cargo">Fundador — CriativaMente Academy</p>
        </div>
      </div>
    </div>
  </div>

  <div class="certificado-aviso" id="bloco-aviso" style="display:none;">
    <h1 id="aviso-titulo">Certificado não disponível</h1>
    <p id="aviso-texto"></p>
    <a class="auth-button" href="/area-do-aluno.html" style="display:inline-block; width:auto; text-decoration:none; padding:11px 24px;">Voltar para minha área</a>
  </div>

  <script type="module">
    import { auth } from "/assets/js/firebase-config.js";
    import { cursoLiberado, buscarCurso } from "/assets/js/access-control.js";
    import { buscarProgresso } from "/assets/js/progress.js";

    const parametros = new URLSearchParams(window.location.search);
    const cursoId = parametros.get("curso");

    document.getElementById("link-voltar").href = cursoId
      ? "/area-do-aluno.html"
      : "/area-do-aluno.html";

    function mostrarAviso(titulo, texto) {
      document.getElementById("tela-certificado").style.display = "none";
      document.getElementById("bloco-aviso").style.display = "block";
      document.getElementById("aviso-titulo").textContent = titulo;
      document.getElementById("aviso-texto").textContent = texto;
    }

    function formatarData(timestamp) {
      if (!timestamp || !timestamp.toDate) return "";
      const data = timestamp.toDate();
      return data.toLocaleDateString("pt-BR", {
        day: "2-digit",
        month: "long",
        year: "numeric"
      });
    }

    document.addEventListener("cm-auth-ready", async (evento) => {
      const usuario = evento.detail.usuario;

      if (!cursoId) {
        mostrarAviso("Certificado não encontrado", "Não identificamos qual curso você quer ver o certificado.");
        return;
      }

      try {
        const liberado = await cursoLiberado(usuario.uid, cursoId);
        if (!liberado) {
          mostrarAviso("Curso não encontrado", "Você não tem acesso a este curso nesta conta.");
          return;
        }

        const progresso = await buscarProgresso(usuario.uid, cursoId);
        if (!progresso || !progresso.concluidoEm) {
          mostrarAviso(
            "Ainda não concluído",
            "Você precisa concluir todas as aulas deste curso para liberar o certificado."
          );
          return;
        }

        const curso = await buscarCurso(cursoId);

        document.getElementById("certificado-nome-aluno").textContent =
          usuario.displayName || "Aluno(a)";
        document.getElementById("certificado-nome-curso").textContent =
          (curso && curso.nome) || "curso";
        document.getElementById("certificado-data").textContent =
          `Concluído em ${formatarData(progresso.concluidoEm)}`;

        document.getElementById("tela-certificado").style.display = "flex";
        document.getElementById("bloco-aviso").style.display = "none";
      } catch (erro) {
        console.error("Erro ao carregar certificado:", erro);
        mostrarAviso("Não foi possível carregar", "Tente novamente em instantes.");
      }
    });

    document.getElementById("botao-imprimir").addEventListener("click", () => {
      window.print();
    });
  </script>

  <script type="module" src="/assets/js/auth-guard.js"></script>
</body>
</html>
