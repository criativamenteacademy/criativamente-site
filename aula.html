<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Aula — CriativaMente Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<!--
  IMPORTANTE: repare que não existe NENHUM texto de aula neste arquivo
  HTML. O conteúdo só é buscado em tempo de execução, depois que:
    1) auth-guard.js confirma login + conta ativa
    2) content-loader.js confirma e-mail verificado + curso liberado
  Sem essas duas confirmações, esta página fica vazia (só o cabeçalho).
  Isso impede que o conteúdo da aula fique visível no código-fonte
  público de uma página estática.
-->
<body class="auth-checking">

  <div class="auth-loading">Carregando aula...</div>

  <header class="aluno-header">
    <a href="/area-do-aluno.html" class="aluno-header__logo">Criativa<span>Mente</span> academy</a>
    <div class="aluno-header__acoes">
      <a class="aluno-header__link" id="link-voltar-curso" href="/area-do-aluno.html">Voltar ao curso</a>
      <button class="aluno-sair" id="botao-sair">Sair</button>
    </div>
  </header>

  <main id="area-principal">
    <div class="aula-erro" id="bloco-erro" style="display: none;">
      <h1 id="erro-titulo">Não foi possível abrir esta aula</h1>
      <p id="erro-texto"></p>
      <a class="auth-button" id="erro-acao" href="/area-do-aluno.html" style="display:inline-block; width:auto; text-decoration:none; padding:11px 24px;">Voltar para minha área</a>
    </div>

    <article class="aula-pagina" id="bloco-aula" style="display: none;">
      <style>
        #aula-html-frame { display:block; width:100%; min-height:78vh; height:1100px; border:0; border-radius:12px; background:#fff; }
        .aula-conteudo--html { width:100%; max-width:none; padding:0; overflow:visible; }
        @media (max-width:700px) { #aula-html-frame { min-height:78vh; height:1250px; border-radius:0; } }
      </style>
      <p id="modulo-nome" style="color:#B5541A; font-weight:600; font-size:14px; text-transform:uppercase; letter-spacing:0.5px; margin-bottom:4px;"></p>
      <h1 id="aula-titulo"></h1>
      <div class="aula-conteudo" id="aula-conteudo"></div>
      <div class="aula-acoes">
        <a class="auth-button" id="botao-anterior" href="#" style="display:none; width:auto; padding:11px 24px; text-decoration:none; text-align:center; background:transparent; border:1px solid #B5541A; color:#B5541A;">← Aula anterior</a>
        <button class="auth-button" id="botao-concluir" style="width:auto; padding:11px 24px;">Marcar aula como concluída</button>
        <a class="auth-button" id="botao-proxima" href="#" style="display:none; width:auto; padding:11px 24px; text-decoration:none; text-align:center;">Próxima aula →</a>
      </div>
    </article>
  </main>

  <script type="module">
    import { auth, db } from "/assets/js/firebase-config.js";
    import { doc, getDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { sairUsuario } from "/assets/js/auth.js";
    import { carregarAula, ERROS } from "/assets/js/content-loader.js";
    import { registrarUltimaAula, marcarAulaConcluida, verificarEMarcarConclusao } from "/assets/js/progress.js";
    import { proximaAula, aulaAnterior, listarModulos, listarAulas } from "/assets/js/access-control.js";
    import { ativarProtecaoConteudo } from "/assets/js/protecao-conteudo.js";

    document.getElementById("botao-sair").addEventListener("click", async () => {
      await sairUsuario();
      window.location.href = "/login.html";
    });

    const parametros = new URLSearchParams(window.location.search);
    const cursoId = parametros.get("curso");
    const moduloId = parametros.get("modulo");
    const aulaId = parametros.get("aula");

    document.getElementById("link-voltar-curso").href = cursoId
      ? `/curso.html?curso=${cursoId}`
      : "/area-do-aluno.html";

    const MENSAGENS_ERRO = {
      [ERROS.NAO_AUTENTICADO]: "Você precisa estar logado para ver esta aula.",
      [ERROS.EMAIL_NAO_VERIFICADO]: "Confirme seu e-mail para liberar o conteúdo das aulas.",
      [ERROS.CONTA_INATIVA]: "Sua conta não está ativa no momento.",
      [ERROS.CURSO_NAO_LIBERADO]: "Você ainda não tem acesso a este curso.",
      [ERROS.CONTEUDO_NAO_ENCONTRADO]: "Esta aula não foi encontrada."
    };

    function mostrarErro(codigo) {
      document.getElementById("bloco-aula").style.display = "none";
      document.getElementById("bloco-erro").style.display = "block";
      document.getElementById("erro-texto").textContent =
        MENSAGENS_ERRO[codigo] || "Tente novamente em instantes.";

      const acao = document.getElementById("erro-acao");
      if (codigo === ERROS.EMAIL_NAO_VERIFICADO) {
        acao.textContent = "Ir para minha área e verificar e-mail";
      }
    }

    document.addEventListener("cm-auth-ready", async (evento) => {
      const usuario = evento.detail.usuario;

      if (!cursoId || !moduloId || !aulaId) {
        mostrarErro(ERROS.CONTEUDO_NAO_ENCONTRADO);
        return;
      }

      try {
        // content-loader.js aplica, nesta ordem: autenticado + e-mail
        // verificado → conta ativa → curso liberado. Só depois disso
        // o conteúdo real da aula é retornado.
        const aula = await carregarAula(cursoId, moduloId, aulaId);

        // Busca o nome do módulo pra mostrar como contexto acima do título da aula
        try {
          const refModulo = doc(db, "cursos", cursoId, "modulos", moduloId);
          const snapModulo = await getDoc(refModulo);
          const nomeModulo = snapModulo.exists() ? snapModulo.data().titulo : "";
          document.getElementById("modulo-nome").textContent = nomeModulo || "";
        } catch (erroModulo) {
          console.warn("Não foi possível carregar o nome do módulo:", erroModulo);
        }

        document.getElementById("aula-titulo").textContent = aula.titulo || "Aula";
        const containerConteudo = document.getElementById("aula-conteudo");
        containerConteudo.replaceChildren();
        if (aula.formato === "html-completo" && aula.htmlCompleto) {
          containerConteudo.classList.add("aula-conteudo--html");
          const frame = document.createElement("iframe");
          frame.id = "aula-html-frame";
          frame.title = aula.titulo || "Conteúdo da aula";
          frame.setAttribute("sandbox", "allow-scripts allow-forms allow-modals");
          frame.setAttribute("referrerpolicy", "no-referrer");
          frame.setAttribute("loading", "eager");
          // O iframe tem origem opaca: o código da aula não acessa o DOM,
          // cookies ou sessão da plataforma. O armazenamento fica isolado por aula
          // e é persistido no localStorage do site através de mensagens verificadas.
          const chaveArmazenamento = 'cm-html-aula:' + cursoId + ':' + moduloId + ':' + aulaId;
          let estadoInicial = {};
          try { estadoInicial = JSON.parse(localStorage.getItem(chaveArmazenamento) || '{}') || {}; } catch (_) { estadoInicial = {}; }
          const estadoInicialSeguro = JSON.stringify(estadoInicial).replace(/</g, '\\u003c');
          const suporte = '<scr' + 'ipt>(function(){var s=' + estadoInicialSeguro + ';var ls={getItem:function(k){return Object.prototype.hasOwnProperty.call(s,k)?String(s[k]):null},setItem:function(k,v){s[String(k)]=String(v);parent.postMessage({type:"cm-html-storage",op:"set",key:String(k),value:String(v)},"*")},removeItem:function(k){delete s[String(k)];parent.postMessage({type:"cm-html-storage",op:"remove",key:String(k)},"*")},clear:function(){s={};parent.postMessage({type:"cm-html-storage",op:"clear"},"*")},key:function(i){return Object.keys(s)[i]||null}};Object.defineProperty(ls,"length",{get:function(){return Object.keys(s).length}});try{Object.defineProperty(window,"localStorage",{configurable:true,value:ls})}catch(e){}function resize(){parent.postMessage({type:"cm-html-height",height:Math.max(document.documentElement.scrollHeight,document.body?document.body.scrollHeight:0)},"*")}if(window.ResizeObserver)new ResizeObserver(resize).observe(document.documentElement);window.addEventListener("load",resize);setTimeout(resize,250);setTimeout(resize,1000)})();</scr' + 'ipt>';
          let htmlAula = String(aula.htmlCompleto);
          // O shim precisa vir antes dos scripts da aula para que a leitura
          // inicial das respostas salvas funcione desde o primeiro script.
          if (/<script\b/i.test(htmlAula)) htmlAula = htmlAula.replace(/<script\b/i, suporte + "<script");
          else if (/<\/body\s*>/i.test(htmlAula)) htmlAula = htmlAula.replace(/<\/body\s*>/i, suporte + "</body>");
          else htmlAula += suporte;
          // Força o tema escuro definido pelo próprio autor, sem trocar as
          // cores por uma paleta da plataforma. Atua somente no CSS da aula.
          htmlAula = htmlAula.replace(/<style\b[^>]*>[\s\S]*?<\/style>/gi, bloco =>
            bloco.replace(/@media\s*\(\s*prefers-color-scheme\s*:\s*dark\s*\)/gi, "@media all")
          );
          frame.style.background = "#111413";
          frame.srcdoc = htmlAula;
          containerConteudo.appendChild(frame);
          window.addEventListener("message", (eventoMensagem) => {
            if (eventoMensagem.source !== frame.contentWindow || !eventoMensagem.data) return;
            const mensagem = eventoMensagem.data;
            if (mensagem.type === "cm-html-height") {
              const altura = Number(mensagem.height);
              if (Number.isFinite(altura)) frame.style.height = Math.max(700, Math.min(12000, altura + 24)) + "px";
              return;
            }
            if (mensagem.type === "cm-html-storage") {
              try {
                const estado = JSON.parse(localStorage.getItem(chaveArmazenamento) || '{}') || {};
                if (mensagem.op === 'set') estado[String(mensagem.key)] = String(mensagem.value);
                else if (mensagem.op === 'remove') delete estado[String(mensagem.key)];
                else if (mensagem.op === 'clear') Object.keys(estado).forEach((k) => delete estado[k]);
                localStorage.setItem(chaveArmazenamento, JSON.stringify(estado));
              } catch (erroStorage) { console.warn('Não foi possível persistir as respostas desta aula neste navegador:', erroStorage); }
            }
          });
        } else {
          containerConteudo.classList.remove("aula-conteudo--html");
          containerConteudo.innerHTML = aula.conteudo || "";
        }

        document.getElementById("bloco-aula").style.display = "block";
        document.getElementById("bloco-erro").style.display = "none";

        // Ativa as proteções (bloqueio de seleção/cópia/atalhos e
        // marca d'água individual) assim que o conteúdo é exibido.
        ativarProtecaoConteudo(
          document.getElementById("aula-conteudo"),
          usuario
        );

        // Guarda esta como a última aula acessada, para o botão
        // "Continuar de onde parei" no painel.
        registrarUltimaAula(usuario.uid, cursoId, moduloId, aulaId);

        // Configura o botão "Aula anterior", se existir uma
        try {
          const anterior = await aulaAnterior(cursoId, moduloId, aulaId);
          const botaoAnterior = document.getElementById("botao-anterior");
          if (anterior) {
            botaoAnterior.href = `/aula.html?curso=${cursoId}&modulo=${anterior.moduloId}&aula=${anterior.aulaId}`;
            botaoAnterior.style.display = "inline-block";
          } else {
            botaoAnterior.style.display = "none";
          }
        } catch (erroAnterior) {
          console.warn("Não foi possível carregar a aula anterior:", erroAnterior);
        }
      } catch (erro) {
        mostrarErro(erro.codigo);
      }
    });

    document.getElementById("botao-concluir").addEventListener("click", async () => {
      const usuario = auth.currentUser;
      if (!usuario || !cursoId || !aulaId) return;

      const botao = document.getElementById("botao-concluir");
      botao.disabled = true;
      botao.textContent = "Salvando...";

      try {
        await marcarAulaConcluida(usuario.uid, cursoId, moduloId, aulaId);
        botao.textContent = "Aula concluída ✓";

        // A conclusão é calculada sobre todas as aulas cadastradas, não só a última aberta.
        const modulos = await listarModulos(cursoId);
        const grupos = await Promise.all(modulos.map(m => listarAulas(cursoId, m.id)));
        const totalAulas = grupos.reduce((total, aulas) => total + aulas.length, 0);
        const concluido = await verificarEMarcarConclusao(usuario.uid, cursoId, totalAulas);

        const botaoProxima = document.getElementById("botao-proxima");
        const proxima = await proximaAula(cursoId, moduloId, aulaId);

        if (concluido) {
          botaoProxima.href = `/certificado.html?curso=${encodeURIComponent(cursoId)}`;
          botaoProxima.textContent = "Curso concluído — ver meu certificado";
        } else if (proxima) {
          botaoProxima.href = `/aula.html?curso=${cursoId}&modulo=${proxima.moduloId}&aula=${proxima.aulaId}`;
          botaoProxima.textContent = "Próxima aula →";
        } else {
          botaoProxima.href = `/area-do-aluno.html`;
          botaoProxima.textContent = "Voltar para minha área";
        }
        botaoProxima.style.display = "inline-block";
      } catch {
        botao.disabled = false;
        botao.textContent = "Marcar aula como concluída";
      }
    });
  </script>

  <script type="module" src="/assets/js/auth-guard.js"></script>
</body>
</html>
