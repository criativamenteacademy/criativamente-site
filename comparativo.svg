<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="480" fill="#FDF6E3"/>

  <!-- Antes column -->
  <g transform="translate(60,60)">
    <rect x="0" y="0" width="400" height="360" rx="18" fill="#FFFFFF" stroke="#E3D9C4" stroke-width="2"/>
    <text x="200" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#6B5744" text-anchor="middle">ATÉ SET/2026</text>

    <circle cx="200" cy="130" r="46" fill="#F0EBDD"/>
    <path d="M182 130 L196 144 L222 114" stroke="#8FA05A" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="200" y="215" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#0F0A05" text-anchor="middle">Resposta ao cliente</text>
    <text x="200" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#8FA05A" text-anchor="middle">GRÁTIS</text>
    <text x="200" y="285" font-family="Arial, sans-serif" font-size="15" fill="#6B5744" text-anchor="middle">dentro da janela de 24h</text>
    <text x="200" y="310" font-family="Arial, sans-serif" font-size="15" fill="#6B5744" text-anchor="middle">após o cliente iniciar contato</text>
  </g>

  <!-- arrow -->
  <g transform="translate(500,240)">
    <line x1="-30" y1="0" x2="30" y2="0" stroke="#B5541A" stroke-width="4"/>
    <path d="M20 -12 L34 0 L20 12" stroke="#B5541A" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Depois column -->
  <g transform="translate(540,60)">
    <rect x="0" y="0" width="400" height="360" rx="18" fill="#0F0A05"/>
    <text x="200" y="50" font-family="Arial, sans-serif" font-size="26" font-weight="700" fill="#E8892A" text-anchor="middle">A PARTIR DE OUT/2026</text>

    <circle cx="200" cy="130" r="46" fill="#2A1D12"/>
    <text x="200" y="142" font-family="Arial, sans-serif" font-size="34" font-weight="700" fill="#E8892A" text-anchor="middle">R$</text>

    <text x="200" y="215" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#FDF6E3" text-anchor="middle">Resposta ao cliente</text>
    <text x="200" y="245" font-family="Arial, sans-serif" font-size="22" font-weight="700" fill="#E8892A" text-anchor="middle">COBRADA</text>
    <text x="200" y="285" font-family="Arial, sans-serif" font-size="15" fill="#C9AE8F" text-anchor="middle">~R$ 0,035 por mensagem</text>
    <text x="200" y="310" font-family="Arial, sans-serif" font-size="15" fill="#C9AE8F" text-anchor="middle">mesmo dentro da janela de 24h</text>
  </g>
</svg>
