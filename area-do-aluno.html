<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Área do Aluno — CriativaMente Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
  <script type="module" src="/assets/js/manutencao-check.js"></script>
</head>
<!-- Protegida por auth-guard.js: sem login válido e conta ativa,
     redireciona para /login.html antes de qualquer conteúdo aparecer. -->
<body class="auth-checking">

  <div class="auth-loading">Carregando sua área do aluno...</div>

  <header class="aluno-header">
    <a href="/area-do-aluno.html" class="aluno-header__logo">Criativa<span>Mente</span> academy</a>
    <div class="aluno-header__acoes">
      <a class="aluno-header__link" href="/index.html">Voltar ao site</a>
      <button class="aluno-header__link" type="button" id="perfil-abrir">Meus dados</button>
      <button class="aluno-sair" id="botao-sair">Sair</button>
    </div>
  </header>

  <div id="aviso-verificacao" class="aviso-verificacao" style="display: none;">
    <span>Confirme seu e-mail para liberar o conteúdo das aulas.</span>
    <button id="botao-reenviar-verificacao">Reenviar e-mail</button>
  </div>

  <main class="aluno-conteudo">
    <div class="aluno-boas-vindas">
      <h1 id="titulo-boas-vindas">Olá!</h1>
      <p>Estes são os cursos disponíveis na sua conta.</p>
    </div>

    <div class="cursos-grid" id="cursos-grid">
      <!-- Cartões de curso inseridos aqui via JavaScript -->
    </div>
    <section id="perfil-modal" class="perfil-modal" role="dialog" aria-modal="true" aria-labelledby="perfil-titulo" hidden><div class="perfil-dialogo"><button type="button" id="perfil-fechar" class="perfil-fechar" aria-label="Fechar janela">×</button>
      <h2 id="perfil-titulo">Meus dados cadastrais</h2>
      <p>Nome e CPF são protegidos. Atualize seus dados de contato e endereço.</p>
      <form id="form-perfil" class="perfil-formulario">
        <div class="auth-field"><label for="perfil-nome">Nome completo (fixo)</label><input id="perfil-nome" disabled  maxlength="150"></div>
<div class="auth-field"><label for="perfil-cpf">CPF (fixo)</label><input id="perfil-cpf" disabled  maxlength="150"></div>
<div class="auth-field"><label for="perfil-email">E-mail</label><input id="perfil-email"  type="email" required maxlength="150"></div>
<div class="auth-field"><label for="perfil-telefone">Telefone</label><input id="perfil-telefone"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-cep">CEP</label><input id="perfil-cep"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-logradouro">Rua / avenida</label><input id="perfil-logradouro"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-numero">Número</label><input id="perfil-numero"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-complemento">Complemento</label><input id="perfil-complemento"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-bairro">Bairro</label><input id="perfil-bairro"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-cidade">Cidade</label><input id="perfil-cidade"   maxlength="150"></div>
<div class="auth-field"><label for="perfil-estado">UF</label><input id="perfil-estado"   maxlength="150"></div>
        <div style="grid-column:1/-1"><p id="perfil-mensagem" role="status" aria-live="polite"></p><button id="perfil-salvar" class="auth-button" type="submit" style="max-width:250px">Salvar alterações</button></div>
      </form></div>
    </section>
  </main>

  <style>
    .perfil-modal[hidden]{display:none!important}
    .perfil-modal{position:fixed;inset:0;z-index:1000;background:rgba(31,41,55,.75);display:flex;align-items:center;justify-content:center;padding:20px;box-sizing:border-box}
    .perfil-dialogo{position:relative;width:min(760px,100%);max-height:90vh;overflow-y:auto;background:#F3F4F6;color:#1F2937;border:2px solid #0E7490;border-radius:16px;padding:32px;box-sizing:border-box;box-shadow:0 24px 70px rgba(0,0,0,.35)}
    .perfil-dialogo h2{color:#1F2937;margin:0 0 10px}
    .perfil-dialogo p{color:#1F2937}
    .perfil-formulario{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
    .perfil-dialogo .auth-field label{color:#1F2937}
    .perfil-dialogo .auth-field input{background:#fff;color:#1F2937;border:1px solid #9CA3AF}
    .perfil-dialogo .auth-field input:focus{outline:2px solid #0E7490}
    .perfil-dialogo .auth-field input:disabled{background:#E5E7EB;color:#4B5563}
    .perfil-dialogo .auth-button{background:#D97706;color:#fff}
    .perfil-dialogo .auth-button:hover{background:#B45309}
    .perfil-fechar{position:absolute;right:16px;top:12px;border:0;background:transparent;color:#1F2937;font-size:32px;cursor:pointer}
    #perfil-abrir{border:1px solid #D97706;border-radius:8px;padding:8px 12px;background:transparent;color:#F3F4F6;cursor:pointer}
    #perfil-abrir:hover{background:#0E7490}
    @media(max-width:550px){.perfil-dialogo{padding:24px 16px}.perfil-formulario{grid-template-columns:1fr}}
  </style>
  <script type="module">
    import { sairUsuario, reenviarVerificacaoDeEmail } from "/assets/js/auth.js";
    import { listarCursosDoAluno, primeiraAula, listarModulos, listarAulas } from "/assets/js/access-control.js";
    import { buscarProgresso } from "/assets/js/progress.js";
    import { db } from "/assets/js/firebase-config.js";
    import { doc, updateDoc } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
    import { verifyBeforeUpdateEmail } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";

    const modalPerfil = document.getElementById("perfil-modal");
    const abrirPerfil = document.getElementById("perfil-abrir");
    const fecharPerfil = document.getElementById("perfil-fechar");
    let focoAnterior = null;
    function alternarPerfil(aberto) {
      modalPerfil.hidden = !aberto;
      document.body.style.overflow = aberto ? "hidden" : "";
      if (aberto) { focoAnterior = document.activeElement; fecharPerfil.focus(); }
      else if (focoAnterior) focoAnterior.focus();
    }
    abrirPerfil.addEventListener("click", () => alternarPerfil(true));
    fecharPerfil.addEventListener("click", () => alternarPerfil(false));
    modalPerfil.addEventListener("click", (evento) => { if (evento.target === modalPerfil) alternarPerfil(false); });
    document.addEventListener("keydown", (evento) => {
      if (modalPerfil.hidden) return;
      if (evento.key === "Escape") alternarPerfil(false);
      if (evento.key === "Tab") {
        const focaveis = [...modalPerfil.querySelectorAll("button:not(:disabled),input:not(:disabled)")];
        const primeiro = focaveis[0], ultimo = focaveis[focaveis.length-1];
        if (evento.shiftKey && document.activeElement === primeiro) { evento.preventDefault(); ultimo.focus(); }
        else if (!evento.shiftKey && document.activeElement === ultimo) { evento.preventDefault(); primeiro.focus(); }
      }
    });
    let usuarioPerfil = null;
    const camposPerfil = ["telefone","cep","logradouro","numero","complemento","bairro","cidade","estado"];
    const campoPerfil = (nome) => document.getElementById("perfil-" + nome);
    const mensagemPerfil = document.getElementById("perfil-mensagem");
    document.getElementById("form-perfil").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      if (!usuarioPerfil) return;
      const botao = document.getElementById("perfil-salvar");
      botao.disabled = true;
      mensagemPerfil.textContent = "Salvando...";
      try {
        const atualizacoes = {};
        for (const campo of camposPerfil) atualizacoes[campo] = campoPerfil(campo).value.trim();
        atualizacoes.estado = atualizacoes.estado.toUpperCase();
        if (atualizacoes.estado && !/^[A-Z]{2}$/.test(atualizacoes.estado)) throw new Error("Informe a UF com duas letras.");
        if (atualizacoes.cep && !/^\d{5}-?\d{3}$/.test(atualizacoes.cep)) throw new Error("Informe um CEP válido.");
        await updateDoc(doc(db, "usuarios", usuarioPerfil.uid), atualizacoes);
        const novoEmail = campoPerfil("email").value.trim();
        if (novoEmail !== usuarioPerfil.email) {
          await verifyBeforeUpdateEmail(usuarioPerfil, novoEmail);
          mensagemPerfil.textContent = "Dados salvos. Confirme o link enviado ao novo e-mail para concluir a alteração.";
        } else mensagemPerfil.textContent = "Dados atualizados com sucesso.";
      } catch (erro) {
        mensagemPerfil.textContent = erro.code === "auth/requires-recent-login"
          ? "Entre novamente na conta para confirmar a alteração do e-mail."
          : (erro.message || "Não foi possível atualizar os dados.");
      } finally { botao.disabled = false; }
    });


    document.getElementById("botao-sair").addEventListener("click", async () => {
      await sairUsuario();
      window.location.href = "/login.html";
    });

    const botaoReenviar = document.getElementById("botao-reenviar-verificacao");
    botaoReenviar.addEventListener("click", async () => {
      botaoReenviar.disabled = true;
      botaoReenviar.textContent = "Enviando...";
      try {
        await reenviarVerificacaoDeEmail();
        botaoReenviar.textContent = "E-mail reenviado!";
      } catch {
        botaoReenviar.textContent = "Não foi possível reenviar";
      }
    });

    async function contarTotalAulas(cursoId) {
      const modulos = await listarModulos(cursoId);
      const contagens = await Promise.all(
        modulos.map((modulo) => listarAulas(cursoId, modulo.id))
      );
      return contagens.reduce((total, aulas) => total + aulas.length, 0);
    }

    function calcularPercentual(totalAulas, progresso) {
      if (!totalAulas || !progresso || !progresso.aulasConcluidas) return 0;
      const concluidas = Object.keys(progresso.aulasConcluidas).length;
      return Math.min(100, Math.round((concluidas / totalAulas) * 100));
    }

    function corProgresso(percentual) {
      const paradas = [
        { p: 0,   cor: [232, 137, 42] },
        { p: 50,  cor: [181, 84, 26] },
        { p: 100, cor: [107, 87, 68] }
      ];
      let a = paradas[0], b = paradas[1];
      for (let i = 0; i < paradas.length - 1; i++) {
        if (percentual >= paradas[i].p && percentual <= paradas[i + 1].p) {
          a = paradas[i]; b = paradas[i + 1];
          break;
        }
      }
      const t = (percentual - a.p) / (b.p - a.p || 1);
      const rgb = a.cor.map((c, i) => Math.round(c + (b.cor[i] - c) * t));
      return `rgb(${rgb.join(",")})`;
    }

    async function montarLinkContinuar(uid, curso, progresso) {
      if (progresso && progresso.ultimoModulo && progresso.ultimaAula) {
        return `/aula.html?curso=${curso.id}&modulo=${progresso.ultimoModulo}&aula=${progresso.ultimaAula}`;
      }
      const primeira = await primeiraAula(curso.id);
      if (primeira) {
        return `/aula.html?curso=${curso.id}&modulo=${primeira.moduloId}&aula=${primeira.aulaId}`;
      }
      return `/curso.html?curso=${curso.id}`;
    }

    document.addEventListener("cm-auth-ready", async (evento) => {
      const usuario = evento.detail.usuario;
      usuarioPerfil = usuario;
      const dados = evento.detail.dadosConta || {};
      campoPerfil("nome").value = dados.nome || usuario.displayName || "";
      campoPerfil("cpf").value = dados.cpf || "";
      campoPerfil("email").value = usuario.email || "";
      for (const campo of camposPerfil) campoPerfil(campo).value = dados[campo] || "";


      const nomeExibido = usuario.displayName ? usuario.displayName.split(" ")[0] : "aluno";
      document.getElementById("titulo-boas-vindas").textContent = `Olá, ${nomeExibido}!`;

      if (!usuario.emailVerified) {
        document.getElementById("aviso-verificacao").style.display = "flex";
      }

      const grid = document.getElementById("cursos-grid");
      const cursos = await listarCursosDoAluno(usuario.uid);

      if (cursos.length === 0) {
        grid.innerHTML = `
          <div class="curso-card__vazio">
            Você ainda não tem nenhum curso liberado nesta conta.
          </div>`;
        return;
      }

      const cartoes = await Promise.all(cursos.map(async (curso) => {
        if (curso.emManutencao === true) {
          return `
            <div class="curso-card" style="opacity:0.7;">
              <h3>${curso.nome}</h3>
              <p>${curso.descricao || ""}</p>
              <p class="progresso-texto" style="color:#B5541A; font-weight:600;">🔧 Em manutenção — volte em breve</p>
            </div>`;
        }

        const progresso = await buscarProgresso(usuario.uid, curso.id);
        const totalAulas = await contarTotalAulas(curso.id);
        const percentual = calcularPercentual(totalAulas, progresso);
        const link = await montarLinkContinuar(usuario.uid, curso, progresso);
        const jaComecou = Boolean(progresso && progresso.ultimaAula);
        const concluido = percentual === 100;

        const linkAcao = concluido ? `/certificado.html?curso=${curso.id}` : link;
        const textoAcao = concluido
          ? "Ver meu certificado"
          : (jaComecou ? "Continuar de onde parei" : "Começar curso");

        return `
          <div class="curso-card">
            <h3>${curso.nome}</h3>
            <p>${curso.descricao || ""}</p>
            <div class="barra-progresso">
              <div class="barra-progresso__preenchimento" style="width:${percentual}%; background:${corProgresso(percentual)};"></div>
            </div>
            <p class="progresso-texto">${percentual}% concluído${concluido ? " 🎓" : ""}</p>
            <a class="curso-card__acao" href="${linkAcao}">
              ${textoAcao}
            </a>
          </div>`;
      }));

      grid.innerHTML = cartoes.join("");
    });
  </script>

  <!-- auth-guard.js precisa ser o último script: valida login + conta
       ativa e só então dispara "cm-auth-ready", usado acima. -->
  <script type="module" src="/assets/js/auth-guard.js"></script>
</body>
</html>
