<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Criar conta — CriativaMente Academy</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@700&family=Inter:wght@400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/css/auth.css" />
</head>
<body class="auth-page">

  <div class="auth-card">
    <a href="/index.html" class="auth-card__logo"><img src="/brand-mark.png" srcset="/brand-mark.png 1x, /brand-mark@2x.png 2x" alt="" aria-hidden="true"> Criativa<span>Mente</span> academy</a>
    <h1>Criar sua conta</h1>
    <p class="auth-subtitle">Cadastre-se para acessar sua área de aluno.</p>

    <p id="mensagem" class="auth-message"></p>

    <form id="form-cadastro" novalidate>
      <div class="auth-field">
        <label for="nome">Nome completo</label>
        <input type="text" id="nome" name="nome" autocomplete="name" required />
      </div>

      <div class="auth-field">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" autocomplete="email" required />
      </div>

      <div class="auth-field">
        <label for="senha">Senha</label>
        <div class="campo-senha">
          <input type="password" id="senha" name="senha" autocomplete="new-password" minlength="6" required />
          <button type="button" class="botao-mostrar-senha" data-alvo="senha" aria-label="Mostrar senha"></button>
        </div>
      </div>

      <button type="submit" class="auth-button" id="botao-cadastrar">Criar conta</button>
    </form>

    <div class="auth-google-separator"><span>ou</span></div>
    <button type="button" class="auth-google-button" id="botao-google">
      <svg viewBox="0 0 48 48" width="20" height="20" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.25 5.48-4.76 7.18l7.73 6C44.42 38.03 46.98 31.89 46.98 24.55z"/><path fill="#FBBC05" d="M10.53 28.59A14.41 14.41 0 0 1 9.75 24c0-1.59.27-3.13.76-4.59l-7.98-6.19A23.87 23.87 0 0 0 0 24c0 3.87.93 7.52 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.92-2.13 15.89-5.8l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Continuar com Google
    </button>

    <p class="auth-footer-link">
      Já tem conta? <a href="/login.html">Fazer login</a>
    </p>
  </div>

  <script type="module">
    import { cadastrarUsuario, entrarComGoogle, traduzirErroFirebase } from "/assets/js/auth.js";
    import { ativarBotoesMostrarSenha } from "/assets/js/mostrar-senha.js";

    ativarBotoesMostrarSenha();

    const form = document.getElementById("form-cadastro");
    const mensagem = document.getElementById("mensagem");
    const botao = document.getElementById("botao-cadastrar");

    function mostrarMensagem(texto, tipo) {
      mensagem.textContent = texto;
      mensagem.className = `auth-message auth-message--${tipo}`;
    }

    const botaoGoogle = document.getElementById("botao-google");
    botaoGoogle.addEventListener("click", async () => {
      botaoGoogle.disabled = true;
      botaoGoogle.setAttribute("aria-busy", "true");
      mostrarMensagem("Conectando com o Google...", "aviso");
      try {
        await entrarComGoogle();
        window.location.href = "/area-do-aluno.html";
      } catch (erro) {
        mostrarMensagem(traduzirErroFirebase(erro.code), "erro");
        botaoGoogle.disabled = false;
        botaoGoogle.removeAttribute("aria-busy");
      }
    });

    form.addEventListener("submit", async (evento) => {
      evento.preventDefault();
      mensagem.className = "auth-message";

      const nome = document.getElementById("nome").value.trim();
      const email = document.getElementById("email").value.trim();
      const senha = document.getElementById("senha").value;

      if (!nome || !email || senha.length < 6) {
        mostrarMensagem("Preencha nome, e-mail e uma senha com pelo menos 6 caracteres.", "erro");
        return;
      }

      botao.disabled = true;
      botao.textContent = "Criando conta...";

      try {
        await cadastrarUsuario(nome, email, senha);
        mostrarMensagem("Conta criada! Enviamos um e-mail de confirmação — você já pode acessar sua área.", "sucesso");
        setTimeout(() => {
          window.location.href = "/area-do-aluno.html";
        }, 1200);
      } catch (erro) {
        mostrarMensagem(traduzirErroFirebase(erro.code), "erro");
        botao.disabled = false;
        botao.textContent = "Criar conta";
      }
    });
  </script>
</body>
</html>
